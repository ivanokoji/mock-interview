<main>

  <section class = "header"> 

    <h1>>Image to text converter</h1>
  
  </section>
  <input type = "file" (change) = "onFileSelected($event)" accept = "image/jpeg,image/png" id="file-upload" style="display: none;"/>
 
    <label for = "file-upload"  class="upload-button">Upload Image</label>

    <section class = "image-preview" >
      <p> Preview the uploaded image here</p>
     <img [src] = "ImageSrc">
    </section>

    <button class = "extract-button" (click) = "extractText()"> Extract the text</button>
    <div *ngIf="isLoading">Processing the image.. </div>
    <textarea class = "extracted-text" [(ngModel)] = "extractedText"> Look at your extracted text here</textarea>
    
    <button class = "copy-button" (click) = "copyToClipboard()"> Copy to the clipboard</button>

</main>
